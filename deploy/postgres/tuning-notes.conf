# Optional PostgreSQL knobs for ~8 GB RAM Hostinger VPS.
# Apply via ALTER SYSTEM or postgresql.conf, then reload.

# shared_buffers = 1GB
# effective_cache_size = 4GB
# work_mem = 8MB
# maintenance_work_mem = 256MB
# max_connections = 100
# random_page_cost = 1.1
# checkpoint_completion_target = 0.9

# Prisma DATABASE_URL should include pool sizing, e.g.:
# postgresql://USER:PASS@127.0.0.1:5432/aadya_institute?connection_limit=15&pool_timeout=20
#
# Budget: 2 API processes × ~15 + 1 worker × ~10 < max_connections
