# Upstream Node API (PM2 cluster / multiple instances)
upstream aadya_api {
    least_conn;
    server 127.0.0.1:5000;
    server 127.0.0.1:5001;
    keepalive 32;
}

# Rate limit zones (shared memory)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=exam_answers:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 25m;
    client_body_timeout 30s;
    send_timeout 60s;

    limit_conn conn_limit 40;

    root /var/www/aadya/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://aadya_api;
        include /etc/nginx/snippets/aadya-proxy.conf;
    }

    location ~ ^/api/v1/exams/attempts/.+/answers {
        limit_req zone=exam_answers burst=20 nodelay;
        proxy_pass http://aadya_api;
        include /etc/nginx/snippets/aadya-proxy.conf;
    }

    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://aadya_api;
        include /etc/nginx/snippets/aadya-proxy.conf;
    }

    location /ws/ {
        proxy_pass http://aadya_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
