# Include or merge into /etc/redis/redis.conf for Aadya on an 8GB VPS.
# Bind locally only — never expose Redis to the internet.

bind 127.0.0.1 -::1
protected-mode yes
port 6379

maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence: AOF is enough for queues; tune if disk is tight
appendonly yes
appendfsync everysec

save 900 1
save 300 10
